<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas — ask large-scale data a question</title>
  <meta name="description" content="A natural-language front door to large-scale data — any warehouse or API described in OKF, discovered via ARD, answered by Gemini under hard cost guardrails.">
  <link rel="stylesheet" href="/instance-frontend.css">
</head>
<body>
  <header class="atlas-header">
    <div class="container header-inner">
      <a href="/" class="wordmark"><span class="atlas-logo logo-26" aria-hidden="true"></span><h1>Atlas</h1></a>
      <nav>
        <a href="/finance" class="nav-link">Finance</a>
        <a href="/implementation" class="nav-link">Implementation</a>
        <a href="https://github.com/srikanthbelwadi/atlas" target="_blank" rel="noopener noreferrer" class="nav-link">GitHub</a>
      </nav>
    </div>
  </header>

  <main id="atlas-app" class="container app-main">
    <div id="empty-hint" class="empty-hint">Ask a question, get a cited answer from large-scale data.</div>
    <div>
      <form id="ask-form" class="ask-form">
        <input id="question" placeholder="Ask a question your data can answer…" autocomplete="off">
        <button id="ask-button" type="submit" disabled>Ask</button>
      </form>
      <div id="working-hint" class="working-hint" hidden>Still working — some questions take a few minutes, especially when a first attempt has to backtrack to another source. Follow along in the trace below.</div>
      <div id="examples" class="example-groups"></div>
    </div>
    <div id="error" class="error-card" hidden></div>
    <div id="trace" class="trace-panel" hidden><div class="panel-label">Life of this query</div><ol id="trace-list"></ol></div>
    <div id="answer" class="answer-canvas" hidden></div>
    <details id="walkthrough" class="walkthrough" hidden>
      <summary><span>Walkthrough — what Atlas did</span><span id="walkthrough-summary" class="walkthrough-summary"></span></summary>
      <div id="walkthrough-body" class="walkthrough-body"></div>
    </details>
  </main>

  <script>window.ATLAS_EXAMPLES={{EXAMPLES_JSON}};</script>
  <script src="/chat-history.js"></script>
  <script src="/instance-frontend.js"></script>
</body>
</html>
