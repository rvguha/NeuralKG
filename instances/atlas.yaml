# Atlas, running on the shared NeuralKG engine.
#
# This file contains deployment choices only: its own ARD finder, identity, corpus examples and
# installed accessors. It does not select an alternate query pipeline.
ard:
  finder_url: http://127.0.0.1:8188
  crosswalk: hub

query_understanding:
  selection_model: openai/gpt-oss-120b

identity:
  name: Atlas
  tagline: Ask large-scale data
  description: Cited answers from Atlas public data, using the shared NeuralKG engine.
  placeholder: e.g. What is the population of India?

# Atlas owns its frontend word-for-word. Its small transport adapter consumes NeuralKG's named
# NLWeb stream and keeps the local turn store; the shared query engine does not know which page
# rendered the result.
frontend:
  template: atlas/frontend.html
  stylesheet: atlas/frontend.css
  javascript: atlas/frontend.js

domains:
  - name: company
    coidentify: hub
    identifiers: [cik, lei]
  - name: place
    coidentify: hub
    identifiers: [dcid, geo, gnis, "fips*"]
  - name: any
    coidentify: hub
    identifiers: [qid]

name_selectors: [q, name, company, place, parent_place]

extensions:
  - plugins.atlas_accessors
  - sec_facts
  - plugins.atlas_datacommons

plugin_config:
  atlas_accessors:
    project: atlas-ard-okf
    byte_cap: 21474836480
    allow_ad_hoc: false
    allowed_tables_file: atlas/allowed-tables.json
    # Reviewed computations may call these BigQuery functions. Operator-owned on purpose: a
    # descriptor arrives from a remote ARD and must not be able to authorize its own function
    # calls. ST_REGIONSTATS hands a raster reduction to Earth Engine.
    allowed_functions:
      - ST_REGIONSTATS
    # Enabling that function must not enable every Earth Engine asset, so scope them by prefix
    # exactly as tables are scoped.
    allowed_assets:
      - ee://ECMWF/ERA5_LAND/
      - ee://UMD/hansen/
    allowed_tables:
      - bigquery-public-data.covid19_open_data.covid19_open_data
      - bigquery-public-data.geo_us_boundaries.counties
      - bigquery-public-data.geo_us_boundaries.states
      - bigquery-public-data.usa_names.usa_1910_current
  atlas_datacommons:
    api_key_env: DC_API_KEY
    max_entities: 3500
    max_rows: 5000
    max_pages: 20
    max_response_bytes: 33554432

source_order: [atlas]
source_examples:
  atlas:
    - What is the population of India?
    - Compare life expectancy in Japan and the United States.
    - How has Brazil's GDP per capita changed since 2000?
    - What was Google's revenue in 2023?
    - What was the most popular baby name in the United States in 2020?

examples:
  - label: Places & demographics — Data Commons
    dirs: [atlas]
    queries:
      - What is the population of India?
      - Compare life expectancy in Japan and the United States.
      - How has median household income in Santa Clara County, CA changed over the last 10 years?
      - How has Brazil's GDP per capita changed since 2000?
      - Compare the fertility rate of Nigeria and Germany over the last 20 years.
      - What is the median age in Miami, Florida?
  - label: Rankings across places — Data Commons
    dirs: [atlas]
    queries:
      - Which counties in California have the highest unemployment rate?
      - Rank US states by median household income, top 10.
      - Which ten countries in Africa have the lowest life expectancy?
      - Rank the countries in Asia by CO2 emissions per capita.
      - Which US states have the highest obesity rate?
  - label: Public health
    dirs: [atlas]
    queries:
      - How did COVID case rates change by year in Alameda County, CA?
      - How did COVID-19 case rates change over time in Los Angeles County, CA?
      - How many people in Texas have diabetes?
  - label: Weather & air quality
    dirs: [atlas]
    queries:
      - What was the average temperature in Chicago in 2023?
      - Which US counties had the worst air quality last year?
      - How has annual average PM2.5 in Los Angeles County changed over the last five years?
  - label: Cities & crime
    dirs: [atlas]
    queries:
      - What are the most common types of crime reported in Chicago?
      - What are the most common 311 complaint types in New York City?
      - How have motor-vehicle collisions in New York City trended by year?
  - label: Climate & land — Earth Engine
    dirs: [atlas]
    queries:
      - Which counties in California were the hottest in July 2025?
      - Which Oregon counties have lost the most forest since 2000?
  - label: Companies & SEC filings
    dirs: [atlas]
    queries:
      - What was Google's revenue in 2023?
      - Revenue for Apple, Microsoft and Nvidia over the last five fiscal years.
  - label: Elections, search & society
    dirs: [atlas]
    queries:
      - Which candidates raised the most money in federal campaign contributions recently?
      - Which committees received the largest individual contributions in the 2020 cycle?
      - What were the top rising search terms in the United States most recently?
      - What was the most popular baby name in the United States in 2020?
