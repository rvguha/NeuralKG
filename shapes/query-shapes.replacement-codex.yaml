      operator: ReadRows
      inputs: []
    - id: b
      operator: Filter
      inputs:
      - a
    - id: c
      operator: Project
      inputs:
      - b
    output: c
    parameter_names:
    - population
    - row_predicate
    - projection
  example_input_contract: State, revenue and employee count present on the same enumerable record relation.
