- id: reduce.quantiles
  title: Compute one or more exact quantiles and optionally their difference
  asks: Compute one or more exact quantiles and optionally their difference. Median is q=.5; IQR uses q=.25,.75
    and subtracts results. No fixed-state approximation substituted.
  examples:
  - What is the interquartile range of county obesity rates?
  negative_examples:
  - question: What percentile is Rice University in for research spending?
    input_condition: Rice's reference value and a complete population for below/equal/total counts.
    why_not: Percentile rank counts around a reference value; a quantile selects an ordered population value.
    instead: rank.percentile
  - question: What is the median age in Miami, Florida?
    input_condition: A source directly publishes median age as one place-level statistic.
    why_not: '"Median age" names the published measure; the question does not request computing a new median from person rows.'
    instead: lookup.scalar
  not:
    rank.percentile: Percentile rank counts around a reference value; a quantile selects an ordered population value.
    reduce.streaming: Exact quantiles and IQR require order statistics, not bounded-state moment accumulation.
  slots:
    population:
