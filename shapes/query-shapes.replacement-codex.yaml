- id: records.select
  title: Search or enumerate records and apply row-local predicates
  asks: Search or enumerate records and apply row-local predicates. All tested fields are co-delivered. Owner/topic
    are predicate bindings; eligibility only when already materialized. Explicit negative values support absence
    claims, missing rows do not.
  examples:
  - List Texas nonprofits with revenue above $5 million and at least 50 employees.
  negative_examples:
  - question: List every county with its health spending where available, retaining counties without spending
      data.
    input_condition: County relation and spending relation, left join, null markers for missing spending.
    why_not: Predicates needing fields from different inputs require alignment, not a row-only predicate.
    instead: join.enrich
  not:
    join.enrich: Predicates needing fields from different inputs require alignment, not a row-only predicate.
    set.union: OR over independently enumerated memberships needs union and deduplication.
    eligibility.evaluate: Unknown eligibility requiring rule acquisition is not a materialized searchable field.
  slots:
    population:
      type: enumerable relation scope with required fields, predicates, grain and coverage evidence
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    row_predicate:
      language: Boolean combination of comparisons over available fields and constants; true allowed
      contract: No reads or aggregates; null uses explicitly bound three-valued semantics.
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    projection:
      type: available output fields; no hidden computation or acquisition
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
  requires:
    input_contract: All tested fields are co-delivered. Owner/topic are predicate bindings; eligibility only when
      already materialized. Explicit negative values support absence claims, missing rows do not.
    evidence: *id001
  returns:
    grain: one row per qualifying record
    projection_rule: Only available result fields may be projected; preserve units, nulls, multiplicity and evidence
