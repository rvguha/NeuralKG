      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    relation_path:
      type: finite nonempty ordered relation list of length >= 2
      contract: RepeatTraverse loops over this list. Each iteration is the same edge traversal operation, never
        an arbitrary embedded plan.
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    cycle_policy:
      type: string
      contract: Must be supplied or clarified; may bind values or a declared operator-specific method, never insert
        a subplan.
      description: Stop-on-repeated-node, allow-within-finite-path, or error; never unbounded traversal.
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    distinct_keys:
