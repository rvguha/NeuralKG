      contract: Must be supplied or clarified; may bind values or a declared operator-specific method, never insert
        a subplan.
      description: One or more probabilities in [0,1], e.g. [.25,.75] for IQR.
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    quantile_convention:
      type: object
      contract: Must be supplied or clarified; may bind values or a declared operator-specific method, never insert
        a subplan.
      description: Exact interpolation/order-statistic convention and missing-value handling.
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    scalar_expression:
      language: finite pure arithmetic/Boolean expression over supplied node values and constants
      operators: *id002
      forbidden: *id003
      required_policies: *id004
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
  requires:
    input_contract: Median is q=.5; IQR uses q=.25,.75 and subtracts results. No fixed-state approximation substituted.
    evidence: *id001
  returns:
    grain: one or more exact order statistics or their scalar combination
