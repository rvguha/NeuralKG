- id: reduce.streaming
  title: Reduce one relation with a declared fixed-state statistic
  asks: Reduce one relation with a declared fixed-state statistic. Sum/count/mean/range/variance/stddev, paired
    weighted mean, conditional counts or HHI from sum(x^2)/sum(x)^2; required values and weights/predicates co-delivered.
    IQR/quantiles, top-N share, Gini and distinct counts use other templates.
  examples:
  - What is the mean diabetes rate across US counties?
  negative_examples:
  - question: What is the interquartile range of county obesity rates?
    input_condition: Complete observations, quantiles .25 and .75, and an interpolation convention.
    why_not: Exact quantiles and IQR require order statistics, not bounded-state moment accumulation.
    instead: reduce.quantiles
  not:
    reduce.quantiles: Exact quantiles and IQR require order statistics, not bounded-state moment accumulation.
    reduce.distinct: Distinct counting requires identity deduplication state.
    reduce.top-share: Top-N share requires selecting the largest contributions; HHI can use sum and sum-of-squares.
    reduce.gini: Gini requires ordered contribution accumulation; HHI does not.
    meta.count: Resource catalog enumeration is a discovery input contract, not publisher observations.
  slots:
    population:
      type: enumerable relation scope with required fields, predicates, grain and coverage evidence
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    stream_kernel:
      enum: &id005
      - count
      - sum
      - mean
      - min
      - max
      - range
      - variance
      - stddev
      - weighted_mean
      - predicate_count
      - conditional_counts
      - sum_and_sum_squares
      - pearson_moments
      contract: Declared finite-state accumulator; conditional_counts emits numerator and denominator; weights and
        predicate fields must already be present. No distinct sets, quantiles, arbitrary reducers or subqueries.
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    scalar_expression:
      language: finite pure arithmetic/Boolean expression over supplied node values and constants
      operators: *id002
      forbidden: *id003
      required_policies: *id004
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
  requires:
    input_contract: Sum/count/mean/range/variance/stddev, paired weighted mean, conditional counts or HHI from sum(x^2)/sum(x)^2;
      required values and weights/predicates co-delivered. IQR/quantiles, top-N share, Gini and distinct counts
      use other templates.
    evidence: *id001
  returns:
    grain: one fixed-state statistic
    projection_rule: Only available result fields may be projected; preserve units, nulls, multiplicity and evidence
      scope.
  plan:
    nodes:
    - id: a
      operator: ReadRows
      inputs: []
    - id: b
      operator: StreamReduce
      inputs:
      - a
    - id: c
      operator: Scalar
      inputs:
      - b
    output: c
    parameter_names:
    - population
    - stream_kernel
    - scalar_expression
