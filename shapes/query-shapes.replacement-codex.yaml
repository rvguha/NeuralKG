catalog:
  name: Codex replacement query-shape catalog
  version: '1'
  status: independent replacement candidate; not installed
  entry_count: 76
  baseline_sha256: fb7de52ee9b2adcb3740b74754ec6e144ddaa2b9e089d450f97150897c4a11f3
  reduction_sha256: 4b543c1622786432639e81ce82202fae382ee3b70de2d1ca89197b31393ef0f6
  identity: typed parameterized operator/dependency template
  runtime_compatibility: Uses the shapes/id/title/asks/examples/slots/requires/not authoring envelope. Plan execution
    and evaluation-label migration are not implemented.
planning_rules:
- Physical API adapters may realize a declared input contract; they may not hide additional logical joins, reductions
  or model fits.
- A precomputed answer can discharge a computation only with equivalent grain, definition, period, scope and evidence.
  It does not globally merge that computation with lookup.
- All enumerations, joins, reductions, statistical kernels and dependent acquisitions remain explicit nodes.
- Constants, field coordinates, projection, named finite fan-out cardinality and declared kernel arguments are bindings,
  not catalog entries.
- Boolean predicate identity, lag zero and relative slice zero are legal neutral bindings; arbitrary optional stages
  are not.
- 'A route is not chosen just from a legacy label: bind requested computation and advertised input capabilities
  first. If underspecified, clarify; if unavailable, report infeasible.'
- These are design-level DAGs, not executable plans. Operator contracts below and routing prose require implementation
  before automated equivalence can be claimed.
shapes:
- id: lookup.scalar
  title: Read a bound value and optionally test it
  asks: Read a bound value and optionally test it. One scalar or direct edge assertion; freshness metadata is co-delivered.
    A latest-period discovery dependency uses lookup.event-bound instead.
  examples:
  - Is the Sierra Club classified as a 501(c)(3)?
  - What is the median age in Miami, Florida?
  negative_examples:
  - question: By what percentage did Tesla's revenue grow from 2021 to 2023?
    input_condition: Two reported revenue values, with common units and reporting basis.
    why_not: Two independently acquired scalar operands and a formula require the binary plan.
    instead: lookup.binary
  not:
    lookup.binary: Two independently acquired scalar operands and a formula require the binary plan.
    lookup.event-bound: A date discovered by one request before binding the value request adds a dependency.
  slots:
    scalar_expression:
      language: finite pure arithmetic/Boolean expression over supplied node values and constants
      operators: &id002
      - identity
      - add
      - subtract
      - multiply
      - divide
      - power
      - abs
      - sign
      - compare
      - and
      - or
      - not
      forbidden: &id003
      - acquisition
      - join
      - group
      - sort
      - aggregation
      - model_fit
      required_policies: &id004
      - units
      - 'null'
      - zero_denominator
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    scalar_coordinates:
      type: object
      contract: Must be supplied or clarified; may bind values or a declared operator-specific method, never insert
        a subplan.
      description: 'Per-ReadScalar coordinates keyed by node ID: entity, measure, period and any explicit publisher
        constraint.'
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
    projection:
      type: available output fields; no hidden computation or acquisition
      required_when: When used by a plan node or needed to remove a semantic ambiguity; do not invent missing bindings.
  requires:
    input_contract: One scalar or direct edge assertion; freshness metadata is co-delivered. A latest-period discovery
      dependency uses lookup.event-bound instead.
    evidence: &id001
    - Required fields/keys, predicate support, ordering direction, pagination and completeness must be proved for
      each concrete input operation.
    - Preserve output grain, multiplicity, tie convention, units, temporal basis, identity alignment and missing-data
      semantics.
    - Incomplete enumerations cannot support exact totals, negative existence, full ranking or universal claims
      absent another completeness proof.
    - Ambiguous statistic, allocation model, test, predictive model or temporal convention must be bound or clarified,
      not invented.
  returns:
    grain: one value or Boolean
    projection_rule: Only available result fields may be projected; preserve units, nulls, multiplicity and evidence
      scope.
  plan:
    nodes:
    - id: a
      operator: ReadScalar
      inputs: []
    - id: b
      operator: Scalar
      inputs:
      - a
    output: b
    parameter_names:
    - scalar_expression
    - scalar_coordinates
    - projection
  example_input_contract: A directly addressable status value, with requested freshness metadata if any.
