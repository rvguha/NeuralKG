  asks: Traverse a declared finite relation path. Path is an ordered list of relation types, minimum two, traversed
    by the same bounded loop; no arbitrary recursive subplans or unbounded transitive closure.
  examples:
  - In which states are the universities employing researchers who received NSF awards?
  negative_examples:
  - question: List every county with its health spending where available, retaining counties without spending
      data.
