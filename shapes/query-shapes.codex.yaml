proposal:
  author: codex
  status: independent proposal; not runtime catalog
  baseline_sha256: fb7de52ee9b2adcb3740b74754ec6e144ddaa2b9e089d450f97150897c4a11f3
  baseline_count: 98
  reduced_count: 76
  identity: typed parameterized operator/dependency template
  scope: Reduce the 98-entry baseline, preserving ambiguous originals as explicit routing branches; no automatic
    rewrite of evaluation labels.
rules:
- Physical API adapters may realize a declared input contract; they may not hide additional logical joins,
  reductions or model fits.
- A precomputed answer can discharge a computation only with equivalent grain, definition, period, scope and
  evidence. It does not globally merge that computation with lookup.
- All enumerations, joins, reductions, statistical kernels and dependent acquisitions remain explicit nodes.
- Constants, field coordinates, projection, named finite fan-out cardinality and declared kernel arguments
  are bindings, not catalog entries.
- Boolean predicate identity, lag zero and relative slice zero are legal neutral bindings; arbitrary optional
  stages are not.
- 'A route is not chosen just from a legacy label: bind requested computation and advertised input capabilities
  first. If underspecified, clarify; if unavailable, report infeasible.'
- These are design-level DAGs, not executable plans. Operator contracts below and routing prose require implementation
  before automated equivalence can be claimed.
parameter_contracts:
  bin_rule:
    enum:
    - equal_width_from_min_max
    contract: DeriveBins uses one streaming min/max pass. Quantile-derived bins require a separate order-statistic
      plan, not a new name for this binding.
  test_method:
    enum:
    - welch_two_sample_t
    contract: TwoSampleTest computes per-sample moments, Welch statistic/degrees of freedom and its tail probability.
      Other test algorithms are not silently interchangeable.
  model_spec:
    enum:
    - ordinary_least_squares
    contract: Predictor columns, intercept, training population and rank-deficiency policy must be specified.
      No model selection or hyperparameter search hidden in FitModel.
  baseline_spec:
    type: supplied linear-model coefficients and feature schema
    contract: Evaluation only; no fitting.
  acceleration_summary:
    enum:
    - return_second_differences
    - sign_of_mean_second_difference
    contract: A fixed second-difference summary, never an unspecified model fit.
  scalar_expression:
    language: finite pure arithmetic/Boolean expression over supplied node values and constants
    operators:
    - identity
    - add
    - subtract
    - multiply
    - divide
    - power
    - abs
    - sign
    - compare
    - and
    - or
    - not
    forbidden:
    - acquisition
    - join
    - group
    - sort
    - aggregation
    - model_fit
    required_policies:
    - units
    - 'null'
    - zero_denominator
  stream_kernel:
    enum:
    - count
    - sum
    - mean
    - min
    - max
    - range
    - variance
    - stddev
    - weighted_mean
    - predicate_count
    - conditional_counts
    - sum_and_sum_squares
    - pearson_moments
    contract: Declared finite-state accumulator; conditional_counts emits numerator and denominator; weights
      and predicate fields must already be present. No distinct sets, quantiles, arbitrary reducers or subqueries.
  row_predicate:
    language: Boolean combination of comparisons over available fields and constants; true allowed
    contract: No reads or aggregates; null uses explicitly bound three-valued semantics.
  join_mode:
    enum:
    - inner
    - left
    contract: One declared equijoin kernel; mode changes match emission, not input topology.
  match_polarity:
    enum:
    - has_match
    - has_no_match
  temporal_direction:
    enum:
    - backward
    - forward
    - either
    contract: One temporal-neighbor operator with an explicit direction guard and tolerance; valid-time interval
      constraints must hold.
  relation_path:
    type: finite nonempty ordered relation list of length >= 2
    contract: RepeatTraverse loops over this list. Each iteration is the same edge traversal operation, never
      an arbitrary embedded plan.
  ordering:
    type: available field(s), ASC/DESC, null ordering
  limit:
    type: positive integer or all
  projection:
    type: available output fields; no hidden computation or acquisition
  absence_claim:
    enum:
    - no_record_in_scoped_dataset
    - authoritative_nonmembership
    contract: The latter needs completeness/negative-evidence proof. A missing record does not establish an
      absent real-world fact.
  alignment:
    type: explicit identity/time keys, cardinality and unmatched-row policy
    contract: No implicit entity crosswalk; a missing crosswalk is an unmet input requirement.
  population:
    type: enumerable relation scope with required fields, predicates, grain and coverage evidence
  actor_description:
    type: explicit typed binding
    contract: Must be supplied or clarified; may bind values or a declared operator-specific method, never
      insert a subplan.
