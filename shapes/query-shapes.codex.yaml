global_guards:
- Required fields/keys, predicate support, ordering direction, pagination and completeness must be proved for
  each concrete input operation.
- Preserve output grain, multiplicity, tie convention, units, temporal basis, identity alignment and missing-data
  semantics.
- Incomplete enumerations cannot support exact totals, negative existence, full ranking or universal claims
  absent another completeness proof.
- Ambiguous statistic, allocation model, test, predictive model or temporal convention must be bound or clarified,
  not invented.
patterns:
- id: lookup.scalar
  title: Read a bound value and optionally test it
  applies_when: One scalar or direct edge assertion; freshness metadata is co-delivered. A latest-period discovery
    dependency uses lookup.event-bound instead.
  parameters:
  - scalar_expression
  - scalar_coordinates
  - projection
  plan:
  - id: a
    operator: ReadScalar
    inputs: []
  - id: b
    operator: Scalar
    inputs:
    - a
  output: b
  covers:
  - point.value
  - point.status
  - point.categorical
  - point.threshold-check
  - time.latest-vintage
  - relation.existence
- id: lookup.record
  title: Read a complete entity record or published component vector
  applies_when: Publisher supplies the requested record/vector; constructing a breakdown from contributions
    uses reduce.grouped.
  parameters:
  - entity_key
  - projection
  plan:
  - id: a
    operator: ReadRecord
    inputs: []
  - id: b
    operator: Project
    inputs:
    - a
  output: b
  covers:
  - point.record
  - point.breakdown
- id: lookup.binary
  title: Compute from two independently bound scalar operands
  applies_when: Two supplied values; annualized means endpoint CAGR; period-over-period uses supplied period
    totals; geographic allocation weight is supplied. Derived operands and raw windows route separately.
  parameters:
  - scalar_coordinates
  - scalar_expression
  - projection
  plan:
  - id: a
    operator: ReadScalar
    inputs: []
  - id: b
    operator: ReadScalar
    inputs: []
  - id: c
    operator: Scalar
    inputs:
    - a
    - b
  output: c
  covers:
  - point.ratio
  - point.component-share
  - change.absolute
  - change.percent
  - change.direction
  - change.rate-annualized
  - change.period-over-period
  - comparison.difference
  - source.agreement
  - relation.geographic-disaggregation
- id: lookup.version
  title: Read the value from a specified release
  applies_when: Version-addressable scalar input; do not substitute the present release.
  parameters:
  - release
  - scalar_coordinates
  - projection
  plan:
  - id: a
    operator: ReadVersionedScalar
    inputs: []
  - id: b
    operator: Project
    inputs:
    - a
  output: b
  covers:
  - source.vintage
- id: lookup.event-bound
  title: Resolve a date then read the value at it
  applies_when: Event date or latest available date must be discovered before binding the value request.
  parameters:
  - event_selector
  - scalar_coordinates
  - projection
  plan:
  - id: a
    operator: ResolveDate
    inputs: []
  - id: b
    operator: ReadScalar
    inputs:
    - a
  - id: c
    operator: Project
    inputs:
    - b
  output: c
  covers:
  - time.level-at-event
  - time.latest-vintage
- id: records.select
  title: Search or enumerate records and apply row-local predicates
  applies_when: All tested fields are co-delivered. Owner/topic are predicate bindings; eligibility only when
    already materialized. Explicit negative values support absence claims, missing rows do not.
  parameters:
  - population
  - row_predicate
  - projection
  plan:
  - id: a
    operator: ReadRows
    inputs: []
  - id: b
    operator: Filter
    inputs:
    - a
  - id: c
    operator: Project
    inputs:
    - b
  output: c
  covers:
  - records.for-entity
  - records.matching
  - filter.threshold
  - filter.range
  - filter.categorical
  - filter.conjunction-all
  - filter.disjunction-any
  - filter.negation-closed
  - filter.temporal-active
  - topical.eligibility
- id: series.values
  title: Read and align one or more named trajectories
  applies_when: Finite named entities with series-valued input; one entity is fan-out cardinality one.
  parameters:
  - entity_keys
  - measure
  - periods
  - time_alignment
  - projection
  plan:
  - id: a
    operator: MapReadSeries
    inputs: []
  - id: b
    operator: AlignTime
    inputs:
    - a
  - id: c
    operator: Project
    inputs:
    - b
  output: c
  covers:
  - timeseries.single-entity
  - timeseries.multi-entity
- id: compare.values
  title: Read named scalar operands side by side
  applies_when: Each operand is a supplied scalar; period coordinates already bound, not a hidden resampling
    or derived measure.
  parameters:
  - scalar_operands
  - projection
  plan:
  - id: a
    operator: MapReadScalar
    inputs: []
  - id: b
    operator: Assemble
    inputs:
    - a
  output: b
  covers:
  - comparison.values
- id: compare.derived-values
  title: Compute two-input measures for named candidates and display them
  applies_when: Each operand requires two scalar acquisitions, e.g. per-capita normalization or endpoint growth.
  parameters:
  - scalar_operand_pairs
  - scalar_expression
  - projection
  plan:
  - id: a
    operator: MapReadScalarPairs
    inputs: []
  - id: b
    operator: MapScalar
    inputs:
    - a
  - id: c
    operator: Assemble
    inputs:
    - b
  output: c
  covers:
  - comparison.values
- id: compare.winner
  title: Order a closed named set by supplied values
  applies_when: The comparison measure is supplied, not computed from new operands.
  parameters:
  - scalar_operands
  - ordering
  - limit
  - ties
  - projection
  plan:
  - id: a
    operator: MapReadScalar
    inputs: []
  - id: b
    operator: Order
    inputs:
    - a
  - id: c
    operator: Take
    inputs:
    - b
  - id: d
    operator: Project
    inputs:
    - c
  output: d
  covers:
  - comparison.which
- id: compare.derived-winner
  title: Order named candidates by a two-input computed measure
  applies_when: Compute ratio, difference or growth per candidate before ordering.
  parameters:
  - scalar_operand_pairs
  - scalar_expression
  - ordering
  - limit
  - ties
  - projection
  plan:
  - id: a
    operator: MapReadScalarPairs
    inputs: []
  - id: b
    operator: MapScalar
    inputs:
    - a
  - id: c
    operator: Order
    inputs:
    - b
  - id: d
    operator: Take
    inputs:
    - c
  - id: e
    operator: Project
    inputs:
    - d
  output: e
  covers:
  - comparison.which
  - comparison.growth
- id: compare.derived-difference
  title: Compare two independently computed two-input values
  applies_when: Each compared value itself requires a pair of scalar reads and a formula.
  parameters:
  - scalar_operand_pairs
  - scalar_expression
  - comparison_expression
  plan:
  - id: a
    operator: MapReadScalarPairs
    inputs: []
  - id: b
    operator: MapScalar
    inputs:
    - a
  - id: c
    operator: Scalar
    inputs:
    - b
  output: c
  covers:
  - comparison.difference
- id: rank.population
  title: Order an enumerable population and select an extreme prefix
  applies_when: Includes bottom-N, N=1 and topical populations; all population scores must be comparable.
  parameters:
  - population
  - ordering
  - limit
  - ties
  - projection
  plan:
  - id: a
    operator: ReadRows
    inputs: []
  - id: b
    operator: Order
    inputs:
    - a
  - id: c
    operator: Take
    inputs:
    - b
  - id: d
    operator: Project
    inputs:
    - c
  output: d
  covers:
  - rank.top-n
  - rank.extremum-single
- id: rank.named-position
  title: Find a named member's rank or surrounding members
  applies_when: Locate a named rank and return a relative slice; radius zero returns its rank. Projection does
    not perform another read.
  parameters:
  - population
  - ordering
  - ties
  - entity_key
  - relative_offsets
  - projection
  plan:
  - id: a
    operator: ReadRows
    inputs: []
  - id: b
    operator: Rank
    inputs:
    - a
  - id: c
    operator: Locate
    inputs:
    - b
  - id: d
    operator: RelativeSlice
    inputs:
    - c
  - id: e
    operator: Project
    inputs:
    - d
  output: e
  covers:
  - rank.of-named-entity
  - rank.neighbors
- id: rank.reference-distance
  title: Rank members by distance from a named reference value
  applies_when: Closest values, not adjacent ordinal ranks. Absolute value distance can order neighbors differently
    from rank distance.
  parameters:
  - scalar_coordinates
  - population
  - scalar_expression
  - ordering
  - limit
  - ties
  - projection
  plan:
  - id: a
    operator: ReadScalar
    inputs: []
  - id: b
    operator: ReadRows
    inputs: []
  - id: c
    operator: MapScalar
    inputs:
    - a
    - b
  - id: d
    operator: Order
    inputs:
    - c
  - id: e
    operator: Take
    inputs:
    - d
  - id: f
    operator: Project
    inputs:
    - e
  output: f
  covers:
  - rank.neighbors
- id: rank.change
  title: Rank two populations then compare member ranks
  applies_when: Each endpoint requires population-wide ranking before alignment and rank subtraction.
  parameters:
  - population_pair
  - ordering
  - ties
  - limit
  - scalar_expression
  plan:
  - id: a
    operator: ReadRows
    inputs: []
  - id: b
    operator: ReadRows
    inputs: []
  - id: c
    operator: Rank
    inputs:
    - a
  - id: d
    operator: Rank
    inputs:
    - b
  - id: e
    operator: AlignEntity
    inputs:
    - c
    - d
  - id: f
    operator: MapScalar
    inputs:
    - e
  - id: g
    operator: Order
    inputs:
    - f
  - id: h
    operator: Take
    inputs:
    - g
  output: h
  covers:
  - rank.change
- id: rank.percentile
  title: Locate a reference value in a population distribution
  applies_when: Reference scalar and full comparison population are required; tied-value convention is explicit.
  parameters:
  - scalar_coordinates
  - population
  - percentile_convention
  plan:
  - id: a
    operator: ReadScalar
    inputs: []
  - id: b
    operator: ReadRows
    inputs: []
  - id: c
    operator: ReferenceCounts
    inputs:
    - a
    - b
  - id: d
    operator: Scalar
    inputs:
    - c
  output: d
  covers:
  - rank.percentile-of-entity
- id: rank.grouped
  title: Select extreme members independently within each group
  applies_when: Group membership is co-delivered, with no hidden bridge or prior group aggregate.
  parameters:
  - population
  - group_keys
  - ordering
  - limit
  - ties
  - projection
  plan:
  - id: a
    operator: ReadRows
    inputs: []
  - id: b
    operator: Group
    inputs:
    - a
  - id: c
    operator: GroupOrder
    inputs:
    - b
  - id: d
    operator: GroupTake
    inputs:
    - c
  - id: e
    operator: Project
    inputs:
    - d
  output: e
  covers:
  - rank.within-group
- id: reduce.streaming
  title: Reduce one relation with a declared fixed-state statistic
  applies_when: Sum/count/mean/range/variance/stddev, paired weighted mean, conditional counts or HHI from
    sum(x^2)/sum(x)^2; required values and weights/predicates co-delivered. IQR/quantiles, top-N share, Gini
    and distinct counts use other templates.
  parameters:
  - population
  - stream_kernel
  - scalar_expression
  plan:
  - id: a
    operator: ReadRows
    inputs: []
  - id: b
    operator: StreamReduce
    inputs:
    - a
  - id: c
    operator: Scalar
    inputs:
    - b
  output: c
  covers:
  - aggregate.sum
  - aggregate.count
  - aggregate.mean
  - aggregate.spread
  - aggregate.weighted-mean
  - assoc.conditional-rate
